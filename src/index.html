<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Donezo</title>
    <meta name="description" content="A small todo app that keeps everything on your device." />
    <meta name="theme-color" content="#f4f6fb" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOS ignores the manifest's display mode; these are what make
         Add to Home Screen open fullscreen instead of in Safari -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Donezo" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.ts" type="module"></script>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="app-title">
        <h1 class="card__title" id="app-title">Todos</h1>

        <form class="composer" id="todo-form" autocomplete="off">
          <input
            class="composer__input"
            id="todo-input"
            name="title"
            type="text"
            placeholder="What needs to be done?"
            aria-label="What needs to be done?"
            required
            maxlength="200"
          />
          <button class="composer__add" type="submit" aria-label="Add todo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </form>

        <p class="empty" id="empty-state">No todos yet. Add one above.</p>

        <ul class="todos" id="todo-list" aria-live="polite" hidden></ul>
      </section>
    </main>

    <template id="todo-template">
      <li class="todo">
        <button
          class="icon-btn todo__drag"
          type="button"
          data-drag
          aria-label="Reorder todo — drag, or use the arrow keys"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01" />
          </svg>
        </button>

        <label class="todo__check">
          <input class="todo__checkbox" type="checkbox" />
          <span class="todo__box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m20 6-11 11-5-5" /></svg>
          </span>
          <span class="sr-only">Mark as done</span>
        </label>

        <span class="todo__title" data-title></span>

        <input class="todo__edit" type="text" data-edit hidden aria-label="Edit todo" />

        <div class="todo__actions">
          <button class="icon-btn" type="button" data-action="edit" aria-label="Edit todo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
          <button class="icon-btn" type="button" data-action="delete" aria-label="Delete todo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <path d="M10 11v6M14 11v6" />
            </svg>
          </button>
        </div>
      </li>
    </template>
  </body>
</html>
