<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0b1120" />
  <!-- The same checkmark the todo checkbox draws, scaled from its 24px viewBox
       and kept inside the middle 80% so maskable crops never clip it -->
