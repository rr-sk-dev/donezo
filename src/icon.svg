    transform="translate(64 72) scale(16)"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m20 6-11 11-5-5" />
  </g>
</svg>
